# Карьерные профили кандидата. Описание полей — в jobsignal/profiles.py.
#
# Матчер оценивает каждую вакансию под КАЖДЫЙ профиль; письмо, приложенное
# резюме и резюме в отклике hh берутся от профиля с лучшим баллом.
# Первый профиль — профиль по умолчанию.
#
# Резюме (PDF) в репозиторий не попадают: загрузи их в кабинете на странице
# «Резюме» (ляжут в config/resumes/<key>.pdf) или положи туда руками.
#
# 23.10: позиционирование сменилось на два резюме по совету HR — Product
# Owner в финтехе/AI и руководитель лояльности и CRM. Прежние профили
# (Senior AI PM, CPO / Head of Product, Senior PM/PO) сняты: их оценки в базе
# остаются, но в очередь откликов больше не попадают.

profiles:
  - key: po
    name: "Product Owner (финтех, AI)"
    label: "Product Owner / Менеджер продукта"
    resume_path: ./config/resumes/po.pdf
    hh_resume_title: "Product Owner"
    focus: >-
      Product Owner / менеджер продукта / product lead: финтех, брокерские и
      инвестиционные платформы, цифровой банкинг, онбординг и активация
      клиентов, регистрация и проверка документов, требования регулятора,
      AI-продукты (LLM, RAG, ассистенты поддержки); уровень middle+ / senior
    searches:
      - "Product Owner"
      - "Product Owner финтех"
      - "Product Owner банк"
      - "Менеджер продукта финтех"
      - "Менеджер продукта инвестиции"
      - "Product Manager брокер"
      - "Product Manager AI"
      - "Менеджер продукта AI"
      - "Senior Product Manager"
      - "Product Lead"

  - key: loyalty
    name: "Лояльность и CRM"
    label: "Руководитель направления лояльности и CRM"
    resume_path: ./config/resumes/loyalty.pdf
    hh_resume_title: "лояльност"
    focus: >-
      руководитель / head / lead программ лояльности, CRM и удержания:
      бонусные и партнёрские программы, кобрендинг с банком, геймификация,
      retention, LTV, отток, омниканальные CRM-коммуникации (push, SMS, email),
      экономика механик; ритейл, банк, телеком, финтех; уровень lead / head
    searches:
      - "Программа лояльности"
      - "Руководитель программы лояльности"
      - "Head of Loyalty"
      - "Руководитель CRM"
      - "Head of CRM"
      - "CRM маркетинг руководитель"
      - "Retention менеджер"
      - "Геймификация"
